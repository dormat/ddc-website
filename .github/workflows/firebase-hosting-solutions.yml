# Preview branch on a separate Hosting site (control-applications-preview).
# Live production remains ddc-temp → control-applications-ddc (main).

name: Deploy solutions-first preview to Firebase Hosting
on:
  push:
    branches:
      - cursor/solutions-first-site-ee14
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build static site
        run: |
          pip install -r requirements.txt
          python scripts/build_site.py
      - name: Ensure preview Hosting site exists
        env:
          FIREBASE_SERVICE_ACCOUNT_CONTROL_APPLICATIONS_DDC: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CONTROL_APPLICATIONS_DDC }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_CONTROL_APPLICATIONS_DDC" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes firebase-tools@13 hosting:sites:create control-applications-preview \
            --project control-applications-ddc --non-interactive \
            || echo "Site may already exist; continuing with deploy."
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CONTROL_APPLICATIONS_DDC }}
          channelId: live
          projectId: control-applications-ddc
          target: ddc-temp2
